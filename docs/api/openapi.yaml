          type: string
          enum: [pending, approved, withdrawn]
          description: Só `approved` aparece no site, com a Home Edition pública.
        alt:
          type: string
        credit:
          type: [string, 'null']
        crop_x:
          $ref: '#/components/schemas/CropStep'
        crop_y:
