          $ref: '#/components/schemas/CatalogTermKind'
        label:
          $ref: '#/components/schemas/CatalogTermLabel'
    CatalogTermUpdateRequest:
      type: object
      additionalProperties: false
      required: [label, active]
      properties:
        label:
          $ref: '#/components/schemas/CatalogTermLabel'
