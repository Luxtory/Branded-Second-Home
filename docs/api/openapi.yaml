      properties:
        home_concept_id:
          type: string
          format: uuid
        instrument_ref:
          type: string
          minLength: 1
          maxLength: 255
          description: Referência estável do instrumento de autorização (sem dado pessoal).
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
          description: Fim exclusivo da vigência, só se o instrumento tiver termo final; posterior a `valid_from`.
    InvestorAuthorizationRevocationRequest:
