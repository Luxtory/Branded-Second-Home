          type: string
          format: uuid
        home_concept_id:
          type: string
          format: uuid
        brand_partner_id:
          type: string
          format: uuid
        title:
          type: string
        version:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [not_approved, approved]
          description: Estados do REQ-096 — "Não aprovado" e "Aprovado (versão N)".
        essential_elements:
          type: array
          items:
            type: string
        preservation_premises:
          type: array
          items:
            type: string
        specification:
          type: string
        summary:
          type: [string, 'null']
        lifestyle_ids:
          type: array
          items:
            type: string
            format: uuid
        architectural_style_ids:
          type: array
          items:
            type: string
            format: uuid
        approval_refs:
          type: [array, 'null']
          items:
            type: string
        approved_at:
          type: [string, 'null']
          format: date-time
        approved_by_user_id:
          type: [string, 'null']
          format: uuid
        approved_role:
          type: [string, 'null']
          enum: [admin, null]
        operation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    InvestorAuthorizationRequest:
      type: object
      additionalProperties: false
