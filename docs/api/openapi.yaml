openapi: 3.1.0
info:
  title: <project-name> API
  version: 0.1.0
  description: |
    [CUSTOMIZE] Replace this with a one-paragraph description of the API.
    API-First: this contract is updated **before** the implementation. The
    code respects the contract, never the other way around.
  contact:
    name: <team or maintainer>
    email: <contact-email>
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api.example.com/v1
    description: Production
  - url: https://staging.api.example.com/v1
    description: Staging
  - url: http://localhost:8000/v1
    description: Local development

tags:
  - name: health
    description: Liveness and version probes

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      description: Returns 200 OK when the service is up.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /version:
    get:
      tags: [health]
      summary: Build version
      description: Returns the running build version (calver tag or git sha).
      operationId: getVersion
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok

    VersionResponse:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: Calver tag or short git sha of the running build
          example: v2026.04.30-a1b2c3d
        commit:
          type: string
          description: Full git commit sha
          example: a1b2c3d4e5f6...

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code
          example: validation_failed
        message:
          type: string
          description: Human-readable explanation. Never includes stack traces or internal identifiers.
          example: Field 'email' is required.
        correlation_id:
          type: string
          description: Request correlation id for tracing
          example: 9f8e7d6c-...

security:
  - bearerAuth: []
