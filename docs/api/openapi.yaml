openapi: 3.1.0
info:
  title: Luxtory Branded Second Home API
  version: 0.1.0
  description: |
    API REST da plataforma Luxtory Branded Second Home, versionada em `/v1` (TECH-056 do
    `docs/specs/canonical/03-technical-spec.md`): consultas são `GET` somente leitura; mutations usam `POST` com o
    header `Idempotency-Key`. Erros seguem o schema `Error`, com os códigos do TECH-056. Todo request aceita e toda
    resposta devolve `x-correlation-id`.
    API-First: this contract is updated **before** the implementation. The
    code respects the contract, never the other way around.
  contact:
    name: Luxtory

servers:
  - url: /v1
    description: Mesma origem da aplicação (produção e previews da Vercel)
  - url: http://localhost:3000/v1
    description: Local development (`npm run dev`)

tags:
  - name: health
    description: Liveness and version probes
  - name: jobs
    description: Jobs do TECH-090 disparados pelo Vercel Cron (fora de `/v1`, ADR-0004)
  - name: admin
    description: Operações administrativas (REQ-095) sob o guard, com MFA (TECH-050) e auditoria (REQ-015)

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      description: Returns 200 OK when the service is up. Público, sem autenticação.
      operationId: getHealth
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Service is healthy
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /version:
    get:
      tags: [health]
      summary: Build version
      description: Returns the running build version (calver tag or git sha). Público, sem autenticação.
      operationId: getVersion
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Version info
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/authorization-grants:
    post:
      tags: [admin]
      summary: Registra uma autorização para uma party (REQ-014)
      description: |
        Operação não crítica `grant_authorization` (REQ-095), executada pelo pipeline de commands (TECH-054): exige
        sessão de staff com MFA (AAL2) e papel Admin ativo (TECH-050, ADR-0008); grava `operation` e `audit_log`
        (REQ-015). `commands` só aceita operações concedíveis a parceiros (autoridade `grantee`) — nenhuma existe
        ainda, então toda requisição é recusada com `ERR_VALIDATION` até a primeira existir. Enquanto `party` não
        existir (W7), o banco também recusa qualquer grant (dívida transitória D-W2-1, `docs/specs/identity.md`).
        `Origin` ausente ou diferente do host → 403 (TECH-100). Repetir com a mesma `Idempotency-Key` e o mesmo
        corpo devolve a mesma resposta com `idempotency-replayed: true`.
      operationId: createAuthorizationGrant
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationGrantRequest'
      responses:
        '201':
          description: Autorização registrada
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            idempotency-replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/jobs/{job}:
    servers:
      - url: /
        description: Mesma origem da aplicação; jobs ficam fora de `/v1` (ADR-0004)
    get:
      tags: [jobs]
      summary: Executa um job do TECH-090
      description: |
        Chamado pelo Vercel Cron, que só faz `GET`, com `Authorization: Bearer <CRON_SECRET>`. Cada execução e cada
        item são idempotentes (TECH-090); execuções em paralelo produzem um único efeito. Só existem os jobs do
        registro de jobs implementados (W1: `outbox`).
      operationId: runJob
      security:
        - cronSecret: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: job
          in: path
          required: true
          description: Nome do job no TECH-090.
          schema:
            type: string
            enum: [outbox]
      responses:
        '200':
          description: Execução concluída
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cronSecret:
      type: http
      scheme: bearer
      description: |
        Segredo `CRON_SECRET` (Vercel, só Production — ADR-0007), enviado pelo Vercel Cron. Comparado em tempo
        constante.
    sessionCookie:
      type: apiKey
      in: cookie
      name: sb-<project-ref>-auth-token
      description: |
        Sessão do Supabase Auth em cookies `httpOnly` (`SameSite=Lax`), criada pelas telas `/entrar` e `/entrar/mfa`
        (ADR-0008). O nome segue o padrão do `@supabase/ssr` e pode vir dividido em partes (`.0`, `.1`). O servidor
        verifica a assinatura do JWT (ES256, JWKS do Supabase Auth). Auth real só em Production (ADR-0007).

  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      description: |
        Id de correlação do chamador (8–128 caracteres `A-Z a-z 0-9 . _ : -`). Ausente ou inválido, o servidor gera
        um UUID. Aparece em todos os logs do request.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{8,128}$'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chave de idempotência escolhida pelo cliente (TECH-056, ADR-006 do `03`), por ator. Mesma chave e mesmo corpo
        → mesma resposta; corpo diferente → `ERR_IDEMPOTENCY_CONFLICT`.
      schema:
        type: string
        pattern: '^[!-~]{1,255}$'

  headers:
    CorrelationId:
      description: Id de correlação do request (o recebido, se válido, ou um UUID gerado).
      schema:
        type: string
    IdempotencyReplayed:
      description: '`true` quando a resposta é a repetição gravada de uma chave já usada (ADR-006 do `03`).'
      schema:
        type: string
        enum: ['true']

  responses:
    InternalError:
      description: Erro inesperado no servidor. Nunca expõe stack trace nem detalhe interno.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Credencial ausente ou inválida (`ERR_UNAUTHENTICATED`).
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: |
        Requisição inválida (`ERR_VALIDATION`): corpo, `Idempotency-Key` ou valor fora do schema.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        Operação não permitida (`ERR_PERMISSION`): guard negou (papel, MFA, grant) ou `Origin` inválida (TECH-100).
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflito (`ERR_IDEMPOTENCY_CONFLICT`, `ERR_STATE_TRANSITION`).
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso inexistente (`ERR_NOT_FOUND`).
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: |
        Função indisponível agora (`ERR_UNAVAILABLE`): configuração obrigatória ausente (TECH-001) ou contenção de
        locks esgotou as tentativas; nada foi gravado.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok

    VersionResponse:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: |
            Calver tag or short git sha of the running build. Sha curto (7 caracteres) do commit do build, ou
            `unknown` quando o ambiente não informa o commit.
          example: 53c7d5e
        commit:
          type: string
          description: Full git commit sha
          pattern: '^[0-9a-f]{7,40}$'
          example: 53c7d5e0a1b2c3d4e5f60718293a4b5c6d7e8f90

    ErrorCode:
      type: string
      description: |
        Códigos mínimos do TECH-056 e, depois deles, os códigos gerais da plataforma. Cada causa do REQ-098 corresponde
        a ao menos um código; a mensagem pt-BR vem da camada i18n. Código novo entra aqui antes do código-fonte.
      enum:
        - ERR_PERMISSION
        - ERR_MEMBERSHIP_INELIGIBLE
        - ERR_WINDOW_NOT_OPEN
        - ERR_CAPACITY_UNAVAILABLE
        - ERR_BOOKING_CONFLICT
        - ERR_USE_RIGHT_BALANCE
        - ERR_STAY_LENGTH
        - ERR_MIN_NOTICE
        - ERR_CREDITS_INSUFFICIENT
        - ERR_CREDIT_HOLD_INVALID
        - ERR_PRL_MISSING
        - ERR_POLICY_MISSING
        - ERR_PARAMETER_MISSING
        - ERR_PAYMENT_FAILED
        - ERR_STATE_TRANSITION
        - ERR_IDEMPOTENCY_CONFLICT
        - ERR_CONCURRENT_CONFIRMATION
        - ERR_COMPLIANCE_SUSPENDED
        - ERR_DELINQUENCY_RESTRICTED
        - ERR_INTERNAL
        - ERR_VALIDATION
        - ERR_UNAUTHENTICATED
        - ERR_NOT_FOUND
        - ERR_UNAVAILABLE

    JobResult:
      type: object
      required: [job, result]
      properties:
        job:
          type: string
          example: outbox
        result:
          type: object
          description: Contagens da execução, por job. `outbox` → `delivered` e `failed`.
          additionalProperties:
            type: integer
            minimum: 0
          example:
            delivered: 3
            failed: 0

    GrantScope:
      type: object
      additionalProperties: false
      required: [type, id]
      description: "Objeto sobre o qual a autorização vale (por exemplo, um Concept); os tipos chegam com cada módulo."
      properties:
        type:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          maxLength: 64
        id:
          type: string
          minLength: 1
          maxLength: 255
    AuthorizationGrantRequest:
      type: object
      additionalProperties: false
      required: [grantee_party_id, commands, scope, valid_from, valid_until, basis]
      properties:
        grantee_party_id:
          type: string
          format: uuid
          description: Party beneficiária (Brand Partner, Investor ou parceiro).
        commands:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          description: Operações concedíveis (autoridade `grantee`) que a party poderá executar.
          items:
            type: string
            pattern: '^[a-z][a-z0-9_]*$'
        scope:
          $ref: '#/components/schemas/GrantScope'
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
          description: Fim exclusivo da vigência; posterior a `valid_from` e ao instante do registro.
        basis:
          type: string
          minLength: 1
          maxLength: 255
          description: Referência da base registrada (instrumento, aprovação ou ata).
    AuthorizationGrant:
      type: object
      additionalProperties: false
      required:
        - id
        - grantee_party_id
        - commands
        - scope
        - valid_from
        - valid_until
        - basis
        - granted_by_user_id
        - granted_role
        - operation_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        grantee_party_id:
          type: string
          format: uuid
        commands:
          type: array
          items:
            type: string
        scope:
          $ref: '#/components/schemas/GrantScope'
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        basis:
          type: string
        granted_by_user_id:
          type: string
          format: uuid
        granted_role:
          type: string
          enum: [admin]
        operation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable, machine-readable error code. Códigos do TECH-056 (`ERR_PERMISSION`, `ERR_BOOKING_CONFLICT`,
            `ERR_PARAMETER_MISSING`, …) e `ERR_INTERNAL` para erro inesperado.
          pattern: '^ERR_[A-Z_]+$'
          $ref: '#/components/schemas/ErrorCode'
          example: ERR_PARAMETER_MISSING
        message:
          type: string
          description: |
            Human-readable explanation. Never includes stack traces or internal identifiers. Em pt-BR, com a causa
            funcional (REQ-098).
          example: Não foi possível concluir a solicitação. Tente novamente em instantes.
        correlation_id:
          type: string
          description: Request correlation id for tracing
          example: 9f8e7d6c-5b4a-4c3d-8e2f-1a0b9c8d7e6f

security:
  - bearerAuth: []
