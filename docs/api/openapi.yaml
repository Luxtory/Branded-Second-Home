        withdrawal_basis:
          type: string
          minLength: 1
          maxLength: 255
    MediaRendition:
      type: object
      additionalProperties: false
      required: [role, width, height]
      description: Versão guardada no Storage — `master` sanitizado (nunca público) ou uma largura de exibição.
      properties:
        role:
          type: string
          enum: [master, display]
        width:
          type: integer
          minimum: 1
        height:
          type: integer
