openapi: 3.1.0
info:
  title: Luxtory Branded Second Home API
  version: 0.1.0
  description: |
    API REST da plataforma Luxtory Branded Second Home, versionada em `/v1` (TECH-056 do
    `docs/specs/canonical/03-technical-spec.md`): consultas são `GET` somente leitura; mutations usam `POST` com o
    header `Idempotency-Key`. Erros seguem o schema `Error`, com os códigos do TECH-056. Todo request aceita e toda
    resposta devolve `x-correlation-id`.
    API-First: this contract is updated **before** the implementation. The
    code respects the contract, never the other way around.
  contact:
    name: Luxtory

servers:
  - url: /v1
    description: Mesma origem da aplicação (produção e previews da Vercel)
  - url: http://localhost:3000/v1
    description: Local development (`npm run dev`)

tags:
  - name: health
    description: Liveness and version probes
  - name: jobs
    description: Jobs do TECH-090 disparados pelo Vercel Cron (fora de `/v1`, ADR-0004)
  - name: admin
    description: Operações administrativas (REQ-095) sob o guard, com MFA (TECH-050) e auditoria (REQ-015)
  - name: catalog
    description: |
      Catálogo (REQ-020, REQ-022, REQ-027; `docs/specs/catalog.md` §17, ADR-0010, ADR-0019): Brand Partner, Home
      Concept e versões, Home Edition (publicação, mídia e média projetada), Second Home e autorização do Investor. Operações não críticas do REQ-095 com o papel Admin exercido (AAL2),
      `operation` e `audit_log`.
  - name: brand-partners
    description: |
      Jornada pública Brand Partners (REQ-028, TECH-057; `docs/specs/catalog.md` §14): contato para iniciar uma conversa
      com a Luxtory. Sem conta, sem persistência do contato e sem CRM; não cria Brand Partner, grant nem vínculo.
  - name: ownership
    description: |
      Manifestação de interesse (REQ-022–REQ-025; `docs/specs/ownership.md`, ADR-0017): registro público, sem conta,
      dos campos canônicos do `interest`. Nunca cria Ação, Direito de Uso, prerrogativa nem efeito econômico.

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      description: Returns 200 OK when the service is up. Público, sem autenticação.
      operationId: getHealth
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Service is healthy
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /version:
    get:
      tags: [health]
      summary: Build version
      description: Returns the running build version (calver tag or git sha). Público, sem autenticação.
      operationId: getVersion
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Version info
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/authorization-grants:
    post:
      tags: [admin]
      summary: Registra uma autorização para uma party (REQ-014)
      description: |
        Operação não crítica `grant_authorization` (REQ-095), executada pelo pipeline de commands (TECH-054): exige
        sessão de staff com MFA (AAL2) e papel Admin ativo (TECH-050, ADR-0008); grava `operation` e `audit_log`
        (REQ-015). `commands` só aceita operações concedíveis a parceiros (autoridade `grantee`) — nenhuma existe
        ainda, então toda requisição é recusada com `ERR_VALIDATION` até a primeira existir. Enquanto `party` não
        existir (W7), o banco também recusa qualquer grant (dívida transitória D-W2-1, `docs/specs/identity.md`).
        `Origin` ausente ou diferente do host → 403 (TECH-100). Repetir com a mesma `Idempotency-Key` e o mesmo
        corpo devolve a mesma resposta com `idempotency-replayed: true`.
      operationId: createAuthorizationGrant
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationGrantRequest'
      responses:
        '201':
          description: Autorização registrada
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            idempotency-replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /admin/brand-partners:
    post:
      tags: [admin, catalog]
      summary: Registra uma Brand Partner (BR-010…016)
      description: |
        Operação `register_brand_partner`. A autorização de exposição pública da marca (BR-015) é opcional aqui e pode
        ser registrada depois.
        Mesma entrada de todas as operações do catálogo: `Origin` igual ao host (senão 403, TECH-100), sessão de staff
        com MFA (AAL2) e papel Admin ativo exercido (ADR-0008); grava `operation` e `audit_log` (REQ-015). Textos passam
        pela checagem lexical de terminologia (REQ-100/101) → `ERR_VALIDATION`. Repetir com a mesma `Idempotency-Key` e o
        mesmo corpo devolve a mesma resposta com `idempotency-replayed: true`.
      operationId: registerBrandPartner
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandPartnerRequest'
      responses:
        '201':
          description: Brand Partner registrada
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            idempotency-replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPartner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /admin/brand-partners/{id}/exposure-authorization:
    post:
      tags: [admin, catalog]
      summary: Registra a autorização de exposição pública da marca (BR-015)
      description: |
        Operação `authorize_brand_exposure`. Registrada uma única vez; o encerramento não a apaga (histórico). Brand
        Partner inexistente → 404; exposição já registrada ou encerramento eficaz → 409 `ERR_STATE_TRANSITION`.
        Mesma entrada de todas as operações do catálogo: `Origin` igual ao host (senão 403, TECH-100), sessão de staff
        com MFA (AAL2) e papel Admin ativo exercido (ADR-0008); grava `operation` e `audit_log` (REQ-015). Textos passam
        pela checagem lexical de terminologia (REQ-100/101) → `ERR_VALIDATION`. Repetir com a mesma `Idempotency-Key` e o
        mesmo corpo devolve a mesma resposta com `idempotency-replayed: true`.
      operationId: authorizeBrandExposure
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandExposureRequest'
      responses:
        '200':
          description: Autorização de exposição registrada
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            idempotency-replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPartner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /admin/brand-partners/{id}/terminate:
    post:
      tags: [admin, catalog]
      summary: Registra o encerramento da parceria com a Brand Partner (BR-021)
      description: |
        Operação `terminate_brand_partner`. A partir de `terminated_effective_at`, novos usos da marca são recusados
        (Home Concept, versão, aprovação, Home Edition, autorização de Investor, Second Home, exposição); o que já existe não muda
        (BR-022). Direitos sobreviventes ainda não são modelados: sem exceção (limitação temporária, ADR-0010 §4). Já
        encerrada → 409 `ERR_STATE_TRANSITION`.
        Mesma entrada de todas as operações do catálogo: `Origin` igual ao host (senão 403, TECH-100), sessão de staff
        com MFA (AAL2) e papel Admin ativo exercido (ADR-0008); grava `operation` e `audit_log` (REQ-015). Textos passam
        pela checagem lexical de terminologia (REQ-100/101) → `ERR_VALIDATION`. Repetir com a mesma `Idempotency-Key` e o
        mesmo corpo devolve a mesma resposta com `idempotency-replayed: true`.
      operationId: terminateBrandPartner
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandPartnerTerminationRequest'
      responses:
        '200':
          description: Encerramento registrado
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            idempotency-replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPartner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /admin/home-concept-versions:
    post:
      tags: [admin, catalog]
      summary: Registra um Home Concept (versão 1) ou uma versão nova de um Home Concept (BR-013, BR-014)
      description: |
        Operação `create_home_concept_version`. Sem `home_concept_id`, cria o Home Concept da Brand Partner com a versão 1;
        com `home_concept_id`, cria a versão seguinte. Toda versão nasce "Não aprovado" (REQ-096). A versão não tem atributos
        físicos: eles pertencem à Home Edition (`03` §3.1). Referência inexistente → 404; encerramento eficaz → 409.
        Mesma entrada de todas as operações do catálogo: `Origin` igual ao host (senão 403, TECH-100), sessão de staff
        com MFA (AAL2) e papel Admin ativo exercido (ADR-0008); grava `operation` e `audit_log` (REQ-015). Textos passam
        pela checagem lexical de terminologia (REQ-100/101, BR-377) → `ERR_VALIDATION`. Repetir com a mesma
        `Idempotency-Key` e o mesmo corpo devolve a mesma resposta com `idempotency-replayed: true`.
      operationId: createHomeConceptVersion
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeConceptVersionRequest'
      responses:
        '201':
          description: Versão registrada
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            idempotency-replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeConceptVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /admin/home-concept-versions/{id}/approve:
    post:
      tags: [admin, catalog]
      summary: Aprova uma versão do Home Concept (REQ-096)
      description: |
        Operação `approve_home_concept_version`: `not_approved` → `approved`, com as referências das aprovações (BR-010,
        BR-018). Só se aprova versão maior que a vigente; versão aprovada é imutável. Versão inexistente → 404; já aprovada,
        menor ou igual à vigente, ou encerramento eficaz → 409.
        Mesma entrada de todas as operações do catálogo: `Origin` igual ao host (senão 403, TECH-100), sessão de staff
        com MFA (AAL2) e papel Admin ativo exercido (ADR-0008); grava `operation` e `audit_log` (REQ-015). Textos passam
        pela checagem lexical de terminologia (REQ-100/101, BR-377) → `ERR_VALIDATION`. Repetir com a mesma
        `Idempotency-Key` e o mesmo corpo devolve a mesma resposta com `idempotency-replayed: true`.
      operationId: approveHomeConceptVersion
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeConceptVersionApprovalRequest'
      responses:
        '200':
          description: Versão aprovada
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            idempotency-replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeConceptVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /admin/investor-authorizations:
    post:
      tags: [admin, catalog]
      summary: Registra a autorização da Luxtory a um Investor para um Home Concept (BR-310)
      description: |
        Operação `register_investor_authorization`: Home Concept, referência estável do instrumento e vigência. Sem dado
        pessoal; o vínculo com a party do Investor chega na W7. Home Concept inexistente → 404; encerramento eficaz → 409.
        Mesma entrada de todas as operações do catálogo: `Origin` igual ao host (senão 403, TECH-100), sessão de staff
        com MFA (AAL2) e papel Admin ativo exercido (ADR-0008); grava `operation` e `audit_log` (REQ-015). Textos passam
        pela checagem lexical de terminologia (REQ-100/101) → `ERR_VALIDATION`. Repetir com a mesma `Idempotency-Key` e o
        mesmo corpo devolve a mesma resposta com `idempotency-replayed: true`.
      operationId: registerInvestorAuthorization
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestorAuthorizationRequest'
      responses:
        '201':
          description: Autorização registrada
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            idempotency-replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestorAuthorization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /admin/investor-authorizations/{id}/revoke:
    post:
      tags: [admin, catalog]
      summary: Revoga uma autorização de Investor
      description: |
        Operação `revoke_investor_authorization`, com a base. Revogação única; Second Homes já registradas não mudam. Já
        revogada → 409 `ERR_STATE_TRANSITION`.
        Mesma entrada de todas as operações do catálogo: `Origin` igual ao host (senão 403, TECH-100), sessão de staff
        com MFA (AAL2) e papel Admin ativo exercido (ADR-0008); grava `operation` e `audit_log` (REQ-015). Textos passam
        pela checagem lexical de terminologia (REQ-100/101) → `ERR_VALIDATION`. Repetir com a mesma `Idempotency-Key` e o
        mesmo corpo devolve a mesma resposta com `idempotency-replayed: true`.
      operationId: revokeInvestorAuthorization
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestorAuthorizationRevocationRequest'
      responses:
        '200':
          description: Autorização revogada
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            idempotency-replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestorAuthorization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /admin/home-editions:
    post:
      tags: [admin, catalog]
      summary: Registra uma Home Edition de um Home Concept aprovado, em preparação (BR-031, BR-036)
      description: |
        Operação `create_home_edition`: configuração específica e replicável de Second Home — nome, descrição, tipologia,
        configuração dos espaços, área projetada, suítes, capacidade e, opcionalmente, ambientes, amenidades e características.
        Sem localização, modalidade, estrutura patrimonial nem condições comerciais (BR-031, BR-032). Nasce em preparação
        (`material_state = draft`) e fora do público (`visibility = hidden`): a definição material pode ser corrigida até a
        finalização; o vínculo com o Home Concept nunca muda. Home Concept sem versão aprovada ou encerramento eficaz → 409;
        Home Concept inexistente → 404.
        Mesma entrada de todas as operações do catálogo: `Origin` igual ao host (senão 403, TECH-100), sessão de staff
        com MFA (AAL2) e papel Admin ativo exercido (ADR-0008); grava `operation` e `audit_log` (REQ-015). Textos passam
        pela checagem lexical de terminologia (REQ-100/101, BR-377) → `ERR_VALIDATION`. Repetir com a mesma
        `Idempotency-Key` e o mesmo corpo devolve a mesma resposta com `idempotency-replayed: true`.
      operationId: createHomeEdition
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeEditionRequest'
      responses:
        '201':
          description: Home Edition registrada (preparação)
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            idempotency-replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeEdition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /admin/home-editions/{id}:
    post:
      tags: [admin, catalog]
      summary: Edita a preparação de uma Home Edition (definição material e textos)
      description: |
        Operação `update_home_edition_draft`: substitui a definição material e os textos editoriais de uma Home Edition em
        preparação (`draft`), com antes e depois no `audit_log`. O Home Concept não muda. Depois da finalização, recusada → 409
        (alteração material = nova Home Edition, BR-036). Marca com encerramento eficaz → 409; inexistente → 404.
        Mesma entrada de todas as operações do catálogo: `Origin` igual ao host (senão 403, TECH-100), sessão de staff
        com MFA (AAL2) e papel Admin ativo exercido (ADR-0008); grava `operation` e `audit_log` (REQ-015). Textos passam
        pela checagem lexical de terminologia (REQ-100/101, BR-377) → `ERR_VALIDATION`. Repetir com a mesma
        `Idempotency-Key` e o mesmo corpo devolve a mesma resposta com `idempotency-replayed: true`.
      operationId: updateHomeEditionDraft
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeEditionDraftRequest'
      responses:
        '200':
          description: Preparação atualizada
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            idempotency-replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeEdition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /admin/home-editions/{id}/finalize:
    post:
      tags: [admin, catalog]
      summary: Finaliza a definição material de uma Home Edition (BR-036)
      description: |
