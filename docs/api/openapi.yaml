  /brand-partner-contacts:
    post:
      tags: [brand-partners]
      summary: Envia a mensagem do formulário Brand Partners à caixa corporativa (REQ-028)
      description: |
        Público e sem conta (TECH-057, spec `catalog` §14.3–14.6). Ordem: publicação (`BRAND_PARTNERS_SITE`) e
        configuração → `Origin` exata de um domínio permitido do ambiente (nunca o `Host` do request) → tipo de
        conteúdo e corpo de até 32 KiB efetivos, com ou sem `Content-Length` → limite distribuído por origem de rede e
        global (conta também as tentativas recusadas depois) → schema fechado, `Idempotency-Key` e honeypot → envio pelo
        provedor → resposta. Sem CORS: nenhuma resposta traz `Access-Control-Allow-Origin`.

        **Sucesso só com aceite confirmado do provedor** (Resend): `202` não comprova entrega na caixa, leitura,
        aprovação nem prazo de resposta, e a submissão não constitui parceria nem cria conta, Brand Partner ou vínculo.
        Falha de configuração, do limitador, do provedor ou timeout é `503` — um timeout não afirma que nada foi
        enviado. Repetir com a mesma `Idempotency-Key` e o mesmo conteúdo dentro da janela do provedor (24 h,
        runbook) devolve `202` sem novo envio; conteúdo diferente com a mesma chave é `409`. Fora da janela não há
        garantia de deduplicação. Nada do contato é persistido (banco, Redis, logs, cookies, storage do browser ou URL).
      operationId: createBrandPartnerContact
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ContactIdempotencyKey'
        - name: Origin
          in: header
          required: true
          description: |
            Origem do formulário (enviada pelo navegador). Comparada exatamente aos domínios permitidos do ambiente
            (`BRAND_PARTNERS_ALLOWED_ORIGINS`); ausente, `null` ou diferente → `403`.
          schema:
            type: string
      requestBody:
        required: true
        description: |
          JSON (`application/json`, UTF-8) de até 32 KiB. Limites em pontos de código Unicode depois de remover os
          espaços das pontas; texto simples, sem HTML interpretado. Nenhum campo além dos listados é aceito.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandPartnerContactRequest'
      responses:
        '202':
          description: Envio aceito pelo provedor (inclusive repetição da mesma tentativa)
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPartnerContactAccepted'
        '400':
          description: |
            `ERR_VALIDATION`: JSON inválido, schema fechado violado, campo fora do limite ou `Idempotency-Key` ausente ou
            fora do formato UUID. `fields` traz só nomes e códigos dos campos, nunca valores.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPartnerContactValidationError'
        '403':
          description: |
            `ERR_PERMISSION`: `Origin` ausente ou não permitida, ou envio recusado pela proteção. A resposta não diz
            qual proteção recusou.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`ERR_NOT_FOUND`: superfície Brand Partners fechada neste ambiente (`BRAND_PARTNERS_SITE`).'
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `ERR_IDEMPOTENCY_CONFLICT`: a mesma `Idempotency-Key` já foi usada com outro conteúdo dentro da janela do
            provedor. Uma nova submissão é uma tentativa explícita, com outra chave.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: '`ERR_PAYLOAD_TOO_LARGE`: corpo acima de 32 KiB.'
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: '`ERR_UNSUPPORTED_MEDIA_TYPE`: o corpo não é `application/json`.'
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`ERR_RATE_LIMITED`: limite por origem de rede ou global excedido.'
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
            retry-after:
              description: Segundos até a próxima tentativa poder ser aceita.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`ERR_INTERNAL`: erro inesperado; resposta genérica e log sanitizado.'
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            `ERR_UNAVAILABLE`: configuração ausente ou inválida (TECH-001), limitador indisponível, timeout ou envio sem
            aceite confirmado do provedor (inclusive limitação do provedor). Não afirma que nada foi enviado: repetir
            com a mesma `Idempotency-Key` e o mesmo conteúdo.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /interests:
    post:
      tags: [ownership]
      summary: Registra uma manifestação de interesse numa Home Edition publicada (REQ-022–REQ-025)
      description: |
        Público e sem conta (spec `ownership` §5). Ordem: publicação (`PUBLIC_SITE` e `INTEREST_WRITES`) e
        configuração → `Origin` do mesmo host → tipo de conteúdo e corpo de até 8 KiB efetivos → limite distribuído por
        origem de rede e global (conta também as tentativas recusadas depois) → schema fechado e `Idempotency-Key` →
        chave já usada (replay ou conflito) → Home Edition publicada → registro atômico → resposta. Sem CORS:
        nenhuma resposta traz `Access-Control-Allow-Origin`.

        O interesse é preferência comercial: **não constitui aquisição** (REQ-024) e **nunca cria Ação, Direito de Uso**
        ou prerrogativa (REQ-025); `origin` e `partner_ref` são metadados declarados, sem efeito (REQ-023). Repetir com a
        mesma `Idempotency-Key` e o mesmo conteúdo devolve `201` com `idempotency-replayed: true`, sem novo registro;
        conteúdo diferente com a mesma chave é `409`. Recusas não consomem a chave (ADR-0017).
      operationId: createInterest
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/PublicIdempotencyKey'
        - name: Origin
          in: header
          required: true
          description: Origem do request (enviada pelo navegador); precisa ser do mesmo host. Ausente ou diferente → `403`.
          schema:
            type: string
      requestBody:
        required: true
        description: |
          JSON (`application/json`, UTF-8) de até 8 KiB. Textos sem espaços nas pontas e com espaços internos reduzidos a
          um; limites em pontos de código Unicode; controles recusados. Nenhum campo além dos listados é aceito.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestRequest'
      responses:
        '201':
          description: Interesse registrado (inclusive repetição da mesma tentativa)
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
            idempotency-replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestRegistered'
        '400':
          description: |
            `ERR_VALIDATION`: JSON inválido, schema fechado violado, campo fora do limite, `Idempotency-Key` ausente ou
            fora do formato UUID, ou `approx_days` ausente para Co-Owner ou informado para Owner. `fields` traz só
            nomes e códigos dos campos, nunca valores.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestValidationError'
        '403':
          description: '`ERR_PERMISSION`: `Origin` ausente ou de outro host.'
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            `ERR_NOT_FOUND`: escrita de interesse fechada neste ambiente (`PUBLIC_SITE`, `INTEREST_WRITES`), ou Home
            Edition fora do público (em preparação ou retirada do público) ou inexistente (as causas respondem igual).
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `ERR_IDEMPOTENCY_CONFLICT`: a mesma `Idempotency-Key` já registrou outro conteúdo. Uma nova manifestação é
            uma tentativa explícita, com outra chave.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: '`ERR_PAYLOAD_TOO_LARGE`: corpo acima de 8 KiB.'
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: '`ERR_UNSUPPORTED_MEDIA_TYPE`: o corpo não é `application/json`.'
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`ERR_RATE_LIMITED`: limite por origem de rede ou global excedido; nada é registrado.'
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
            retry-after:
              description: Segundos até a próxima tentativa poder ser aceita.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`ERR_INTERNAL`: erro inesperado; resposta genérica e log sanitizado.'
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            `ERR_UNAVAILABLE`: configuração ausente ou inválida (TECH-001), limitador indisponível ou sem resposta no
            prazo, ou banco indisponível; nada é registrado. Repetir com a mesma `Idempotency-Key` e o mesmo conteúdo.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            cache-control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/jobs/{job}:
