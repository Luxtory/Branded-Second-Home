          type: [string, 'null']
          format: uuid
        approved_role:
          type: [string, 'null']
          enum: [admin, null]
        withdrawn_at:
          type: [string, 'null']
          format: date-time
        withdrawal_basis:
          type: [string, 'null']
        operation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    HomeConceptCurationRequest:
      type: object
      additionalProperties: false
      required: [rank, featured]
      properties:
        rank:
          type: [integer, 'null']
          minimum: 1
          maximum: 999
          description: Posição na ordem "Curadoria Luxtory" (menor primeiro); nulo = sem posição.
        featured:
          type: boolean
          description: Destaque editorial explícito (no máximo um Home Concept; exige capa aprovada).
    HomeConceptCuration:
      type: object
      additionalProperties: false
      required: [home_concept_id, rank, featured, operation_id, updated_at]
      properties:
        home_concept_id:
          type: string
          format: uuid
        rank:
          type: [integer, 'null']
        featured:
          type: boolean
        operation_id:
          type: string
          format: uuid
        updated_at:
          type: string
          format: date-time
    HomeEditionProjectedInvestmentRequest:
      type: object
      additionalProperties: false
      description: |
        Média projetada de investimento (BR-034): ordem de grandeza do investimento total projetado para materializar uma
        Second Home da Home Edition. Sem modalidade, base, configuração ou Ação; nunca preço, proposta ou condição.
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000000
          description: Valor em unidades menores da moeda (centavos), TECH-033.
        currency:
          type: string
          enum: [BRL]
        valid_from:
          type: string
          format: date-time
          description: Início da vigência, no futuro; ausente = agora.
    HomeEditionProjectedInvestment:
      type: object
      additionalProperties: false
      required:
        - id
        - home_edition_id
        - amount_minor
        - currency
        - valid_from
        - valid_until
        - registered_by_user_id
        - registered_role
        - operation_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        home_edition_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          enum: [BRL]
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: [string, 'null']
          format: date-time
        registered_by_user_id:
          type: string
          format: uuid
        registered_role:
          type: string
          enum: [admin]
        operation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable, machine-readable error code. Códigos do TECH-056 (`ERR_PERMISSION`, `ERR_BOOKING_CONFLICT`,
            `ERR_PARAMETER_MISSING`, …) e `ERR_INTERNAL` para erro inesperado.
          pattern: '^ERR_[A-Z_]+$'
          $ref: '#/components/schemas/ErrorCode'
          example: ERR_PARAMETER_MISSING
        message:
          type: string
          description: |
            Human-readable explanation. Never includes stack traces or internal identifiers. Em pt-BR, com a causa
            funcional (REQ-098).
          example: Não foi possível concluir a solicitação. Tente novamente em instantes.
        correlation_id:
          type: string
          description: Request correlation id for tracing
          example: 9f8e7d6c-5b4a-4c3d-8e2f-1a0b9c8d7e6f

security:
  - bearerAuth: []
