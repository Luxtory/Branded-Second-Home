    HomeConceptMedia:
      type: object
      additionalProperties: false
      required:
        - id
        - home_concept_id
        - state
        - alt
        - credit
        - crop_x
        - crop_y
        - source_sha256
        - renditions
        - approved_at
        - approved_by_user_id
        - approved_role
        - withdrawn_at
        - withdrawal_basis
        - operation_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        home_concept_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending, approved, withdrawn]
          description: Só `approved` aparece na Coleção.
        alt:
          type: string
        credit:
          type: [string, 'null']
        crop_x:
          $ref: '#/components/schemas/CropStep'
        crop_y:
          $ref: '#/components/schemas/CropStep'
        source_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 do arquivo enviado (rastreio; o arquivo original não é guardado).
        renditions:
          type: array
          items:
            $ref: '#/components/schemas/MediaRendition'
        approved_at:
          type: [string, 'null']
          format: date-time
        approved_by_user_id:
          type: [string, 'null']
          format: uuid
        approved_role:
          type: [string, 'null']
          enum: [admin, null]
        withdrawn_at:
          type: [string, 'null']
          format: date-time
        withdrawal_basis:
          type: [string, 'null']
        operation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    HomeEditionMedia:
      type: object
      additionalProperties: false
      required:
        - id
