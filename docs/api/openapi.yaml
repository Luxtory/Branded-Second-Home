        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/CatalogTermKind'
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Derivado do rótulo no registro; imutável (URLs da Coleção).
        label:
          type: string
        active:
          type: boolean
        operation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    HomeConceptSummary:
      type: string
      minLength: 1
      maxLength: 160
      description: Resumo do card da Coleção.
    GuestsMax:
      type: integer
      minimum: 1
      maximum: 100
      description: 'Capacidade: pessoas que a Home Edition acomoda, no máximo.'
    Suites:
      type: integer
      minimum: 1
      maximum: 50
    ProjectedAreaM2:
      type: integer
      minimum: 1
      maximum: 100000
      description: Área projetada, em m².
    LifestyleIds:
      type: array
      maxItems: 3
      uniqueItems: true
      description: Termos ativos de `lifestyle`, em ordem; o primeiro é o principal (mostrado no card).
      items:
        type: string
        format: uuid
    ArchitecturalStyleIds:
      type: array
      maxItems: 2
      uniqueItems: true
      description: Termos ativos de `architectural_style`, em ordem; o primeiro é o principal.
      items:
        type: string
        format: uuid
    CropStep:
      type: integer
      enum: [20, 35, 50, 65, 80]
      description: Foco da imagem em %, nos passos das classes `lx-crop-*` do Core Design System.
    HomeConceptCoverRequest:
      type: object
      additionalProperties: false
      required: [image, alt, crop_x, crop_y]
      properties:
        image:
          type: string
          format: byte
          minLength: 4
          maxLength: 4194304
          description: JPEG, PNG ou WebP (pelo conteúdo) em base64, até 3 MiB decodificado e 40 MP, com pelo menos 720 × 520 px.
        alt:
          type: string
          minLength: 1
          maxLength: 300
          description: Texto alternativo — o que a imagem mostra.
        credit:
          type: string
          minLength: 1
          maxLength: 200
        crop_x:
          $ref: '#/components/schemas/CropStep'
        crop_y:
          $ref: '#/components/schemas/CropStep'
    HomeEditionMediaKind:
      type: string
      enum: [image, render, floor_plan]
      description: Imagem, render ou planta (BR-031).
    HomeEditionMediaRequest:
      type: object
      additionalProperties: false
      required: [kind, image, alt, crop_x, crop_y]
      properties:
        kind:
          $ref: '#/components/schemas/HomeEditionMediaKind'
        image:
          type: string
          format: byte
          minLength: 4
          maxLength: 4194304
          description: JPEG, PNG ou WebP (pelo conteúdo) em base64, até 3 MiB decodificado e 40 MP, com pelo menos 720 × 520 px.
        alt:
          type: string
          minLength: 1
          maxLength: 300
          description: Texto alternativo — o que a imagem mostra.
        credit:
          type: string
          minLength: 1
          maxLength: 200
        crop_x:
          $ref: '#/components/schemas/CropStep'
