          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 do arquivo enviado (rastreio; o arquivo original não é guardado).
        renditions:
          type: array
          items:
            $ref: '#/components/schemas/MediaRendition'
        approved_at:
          type: [string, 'null']
          format: date-time
