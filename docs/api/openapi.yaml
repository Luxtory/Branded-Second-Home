  /media/home-concept-covers/{id}/{width}:
    servers:
      - url: /
        description: Mesma origem da aplicação; mídia pública fica fora de `/v1` (ADR-0015)
    get:
      tags: [catalog]
      summary: Entrega a capa aprovada de um Home Concept público (spec catalog §13.12)
      description: |
        Leitura pública como `anon` (ADR-0014): só capa `approved` de Home Concept público — qualquer outra (pendente,
        retirada, de Home Concept não público ou inexistente) → 404, sem distinguir o motivo; o master nunca é entregue. WebP
        reencodado pelo servidor, sem metadados, lido do Supabase Storage privado (ADR-0015). O conteúdo de um id e largura
        nunca muda (`ETag` forte); `Cache-Control: no-cache` revalida a cada uso, para a retirada valer na próxima
        requisição (ADR-0014 §8) — `If-None-Match` igual → 304 sem corpo, só com a consulta ao banco. Mesmo portão de
        publicação das páginas públicas (ADR-0014 §6). Storage indisponível → 503.
      operationId: getHomeConceptCover
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ResourceId'
        - name: width
          in: path
          required: true
          description: 'Uma das larguras de exibição da capa (`renditions` com papel `display`), para o `srcset`.'
          schema:
            type: integer
            minimum: 1
            maximum: 1600
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Imagem WebP
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum: ['public, no-cache']
          content:
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
        '304':
          description: A cópia do cliente continua válida
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /media/home-edition-media/{id}/{width}:
    servers:
      - url: /
        description: Mesma origem da aplicação; mídia pública fica fora de `/v1` (ADR-0015)
    get:
      tags: [catalog]
      summary: Entrega uma mídia aprovada (imagem, render ou planta) de uma Home Edition pública (spec catalog §17.7)
      description: |
        Leitura pública como `anon` (ADR-0014): só mídia `approved` de Home Edition pública de Home Concept público — qualquer
        outra (pendente, retirada, de Home Edition em preparação, fora do público ou inexistente) → 404, sem distinguir o motivo; o master nunca é entregue. WebP
        reencodado pelo servidor, sem metadados, lido do Supabase Storage privado (ADR-0015). O conteúdo de um id e largura
        nunca muda (`ETag` forte); `Cache-Control: no-cache` revalida a cada uso, para a retirada valer na próxima
        requisição (ADR-0014 §8) — `If-None-Match` igual → 304 sem corpo, só com a consulta ao banco. Mesmo portão de
        publicação das páginas públicas (ADR-0014 §6). Storage indisponível → 503.
      operationId: getHomeEditionMedia
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ResourceId'
        - name: width
          in: path
          required: true
          description: 'Uma das larguras de exibição da mídia (`renditions` com papel `display`), para o `srcset`.'
          schema:
            type: integer
            minimum: 1
            maximum: 1600
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Imagem WebP
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum: ['public, no-cache']
          content:
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
        '304':
          description: A cópia do cliente continua válida
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cronSecret:
      type: http
      scheme: bearer
      description: |
        Segredo `CRON_SECRET` (Vercel, só Production — ADR-0007), enviado pelo Vercel Cron. Comparado em tempo
        constante.
    sessionCookie:
      type: apiKey
      in: cookie
      name: sb-<project-ref>-auth-token
      description: |
        Sessão do Supabase Auth em cookies `httpOnly` (`SameSite=Lax`), criada pelas telas `/entrar` e `/entrar/mfa`
        (ADR-0008). O nome segue o padrão do `@supabase/ssr` e pode vir dividido em partes (`.0`, `.1`). O servidor
        verifica a assinatura do JWT (ES256, JWKS do Supabase Auth). Auth real só em Production (ADR-0007).

  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      description: |
        Id de correlação do chamador (8–128 caracteres `A-Z a-z 0-9 . _ : -`). Ausente ou inválido, o servidor gera
        um UUID. Aparece em todos os logs do request.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{8,128}$'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chave de idempotência escolhida pelo cliente (TECH-056, ADR-006 do `03`), por ator. Mesma chave e mesmo corpo
        → mesma resposta; corpo diferente → `ERR_IDEMPOTENCY_CONFLICT`.
      schema:
        type: string
        pattern: '^[!-~]{1,255}$'

    ContactIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID imprevisível gerado pelo navegador por tentativa lógica (TECH-057). Retry da mesma tentativa mantém a chave e
        o conteúdo; o servidor a repassa ao provedor com o namespace da aplicação e do ambiente.
      schema:
        type: string
        format: uuid

    PublicIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID imprevisível gerado pelo cliente por tentativa lógica (TECH-056, ADR-0017). Sem conta, o escopo é a
        superfície: retry da mesma tentativa mantém a chave e o conteúdo; conteúdo diferente → `ERR_IDEMPOTENCY_CONFLICT`.
      schema:
        type: string
        format: uuid

    ResourceId:
      name: id
      in: path
      required: true
      description: Id do objeto da operação.
      schema:
        type: string
        format: uuid

  headers:
    CorrelationId:
      description: Id de correlação do request (o recebido, se válido, ou um UUID gerado).
      schema:
        type: string
    NoStore:
      description: Nenhuma resposta do contato Brand Partners nem do registro de interesse é armazenada em cache.
      schema:
        type: string
        enum: [no-store]
    IdempotencyReplayed:
      description: '`true` quando a resposta é a repetição gravada de uma chave já usada (ADR-006 do `03`).'
      schema:
        type: string
        enum: ['true']

  responses:
    InternalError:
      description: Erro inesperado no servidor. Nunca expõe stack trace nem detalhe interno.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Credencial ausente ou inválida (`ERR_UNAUTHENTICATED`).
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: |
        Requisição inválida (`ERR_VALIDATION`): corpo, `Idempotency-Key` ou valor fora do schema.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        Operação não permitida (`ERR_PERMISSION`): guard negou (papel, MFA, grant) ou `Origin` inválida (TECH-100).
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflito (`ERR_IDEMPOTENCY_CONFLICT`, `ERR_STATE_TRANSITION`).
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso inexistente (`ERR_NOT_FOUND`).
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: |
        Função indisponível agora (`ERR_UNAVAILABLE`): configuração obrigatória ausente (TECH-001) ou contenção de
        locks esgotou as tentativas; nada foi gravado.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok

    VersionResponse:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: |
            Calver tag or short git sha of the running build. Sha curto (7 caracteres) do commit do build, ou
            `unknown` quando o ambiente não informa o commit.
          example: 53c7d5e
        commit:
          type: string
          description: Full git commit sha
          pattern: '^[0-9a-f]{7,40}$'
          example: 53c7d5e0a1b2c3d4e5f60718293a4b5c6d7e8f90

    ErrorCode:
      type: string
      description: |
        Códigos mínimos do TECH-056 e, depois deles, os códigos gerais da plataforma. Cada causa do REQ-098 corresponde
        a ao menos um código; a mensagem pt-BR vem da camada i18n. Código novo entra aqui antes do código-fonte.
      enum:
        - ERR_PERMISSION
        - ERR_MEMBERSHIP_INELIGIBLE
        - ERR_WINDOW_NOT_OPEN
        - ERR_CAPACITY_UNAVAILABLE
        - ERR_BOOKING_CONFLICT
        - ERR_USE_RIGHT_BALANCE
        - ERR_STAY_LENGTH
        - ERR_MIN_NOTICE
        - ERR_CREDITS_INSUFFICIENT
        - ERR_CREDIT_HOLD_INVALID
        - ERR_PRL_MISSING
        - ERR_POLICY_MISSING
        - ERR_PARAMETER_MISSING
        - ERR_PAYMENT_FAILED
        - ERR_STATE_TRANSITION
        - ERR_IDEMPOTENCY_CONFLICT
        - ERR_CONCURRENT_CONFIRMATION
        - ERR_COMPLIANCE_SUSPENDED
        - ERR_DELINQUENCY_RESTRICTED
        - ERR_INTERNAL
        - ERR_VALIDATION
        - ERR_UNAUTHENTICATED
        - ERR_NOT_FOUND
        - ERR_UNAVAILABLE
        - ERR_PAYLOAD_TOO_LARGE
        - ERR_UNSUPPORTED_MEDIA_TYPE
        - ERR_RATE_LIMITED

    BrandPartnerContactRequest:
      type: object
      description: |
        Campos autorizados pelo REQ-028 (spec `catalog` §14.3). Sem CNPJ, telefone, faturamento, orçamento, documentos,
        anexos ou consentimentos. `_trap` é o honeypot técnico: ausente ou vazio; preenchido → `403` sem envio.
      additionalProperties: false
      required: [name, brand, email, message]
      properties:
        name:
          type: string
          description: Nome — 1 a 120 caracteres.
          minLength: 1
          maxLength: 120
        brand:
          type: string
          description: Marca — 1 a 200 caracteres.
          minLength: 1
          maxLength: 200
        email:
          type: string
          description: |
            E-mail — válido, até 254 caracteres, sem CR/LF; não exige domínio corporativo. Usado só como `Reply-To`.
          format: email
          maxLength: 254
        message:
          type: string
          description: Mensagem — 1 a 4.000 caracteres, texto simples com quebras de linha preservadas.
          minLength: 1
          maxLength: 4000
        website:
          type: string
          description: |
            Site da marca — opcional; vazio = ausente. URL `http`/`https` de até 500 caracteres, sem credenciais. O
            servidor nunca acessa o endereço.
          maxLength: 500
        _trap:
          type: string
          description: Honeypot técnico, sem campo de negócio.

    BrandPartnerContactAccepted:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted]

    BrandPartnerContactValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            fields:
              type: array
              description: Campos recusados — só nome e código, nunca o valor enviado.
              items:
                type: object
                additionalProperties: false
                required: [field, code]
                properties:
                  field:
                    type: string
                    enum: [name, brand, email, message, website]
                  code:
                    type: string
                    enum: [required, too_long, invalid]

    InterestModality:
      type: string
      enum: [owner, co_owner]
      description: Modalidade desejada (BR-030, BR-032); a Home Edition não restringe modalidade.
    InterestRequest:
      type: object
      description: |
        Campos canônicos do `interest` (`03` §3.1; spec `ownership` §5.1 e §13). Sem dado de contato (W6). A manifestação
        parte de uma Home Edition publicada; o Home Concept vem dela. `origin` e `partner_ref` são metadados declarados e
        não confiáveis: nunca concedem acesso, autorização, representação, comissão ou atribuição comercial.
      additionalProperties: false
      required: [home_edition_id, modality, desired_location]
      properties:
        home_edition_id:
          type: string
          format: uuid
          description: Home Edition publicada (REQ-022, BR-030).
        modality:
          $ref: '#/components/schemas/InterestModality'
        desired_location:
          type: string
          description: Localização pretendida em texto livre — 1 a 200 caracteres (BR-030).
          minLength: 1
          maxLength: 200
        approx_days:
          type: [integer, 'null']
          description: |
            Necessidade aproximada de dias — obrigatória para `co_owner` (inteiro positivo, sem teto de negócio; limite de
            representação de 32 bits) e ausente ou `null` para `owner`. Preferência comercial, nunca direito (REQ-025).
          minimum: 1
          maximum: 2147483647
        origin:
          type: [string, 'null']
          description: Origem declarada da manifestação — opcional, até 200 caracteres; vazio = ausente (REQ-023).
          maxLength: 200
        partner_ref:
          type: [string, 'null']
          description: Referência declarada de parceiro/atribuição — opcional, até 200 caracteres; vazio = ausente.
          maxLength: 200
    InterestRegistered:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [registered]

    InterestValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            fields:
              type: array
              description: Campos recusados — só nome e código, nunca o valor enviado.
              items:
                type: object
                additionalProperties: false
                required: [field, code]
                properties:
                  field:
                    type: string
                    enum: [home_edition_id, modality, desired_location, approx_days, origin, partner_ref]
                  code:
                    type: string
                    enum: [required, too_long, invalid, not_allowed]

    JobResult:
      type: object
      required: [job, result]
      properties:
        job:
          type: string
          example: outbox
        result:
          type: object
          description: Contagens da execução, por job. `outbox` → `delivered` e `failed`.
          additionalProperties:
            type: integer
            minimum: 0
          example:
            delivered: 3
            failed: 0

    GrantScope:
      type: object
      additionalProperties: false
      required: [type, id]
      description: "Objeto sobre o qual a autorização vale (por exemplo, um Home Concept); os tipos chegam com cada módulo."
      properties:
        type:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          maxLength: 64
        id:
          type: string
          minLength: 1
          maxLength: 255
    AuthorizationGrantRequest:
      type: object
      additionalProperties: false
      required: [grantee_party_id, commands, scope, valid_from, valid_until, basis]
      properties:
        grantee_party_id:
          type: string
          format: uuid
          description: Party beneficiária (Brand Partner, Investor ou parceiro).
        commands:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          description: Operações concedíveis (autoridade `grantee`) que a party poderá executar.
          items:
            type: string
            pattern: '^[a-z][a-z0-9_]*$'
        scope:
          $ref: '#/components/schemas/GrantScope'
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
          description: Fim exclusivo da vigência; posterior a `valid_from` e ao instante do registro.
        basis:
          type: string
          minLength: 1
          maxLength: 255
          description: Referência da base registrada (instrumento, aprovação ou ata).
    AuthorizationGrant:
      type: object
      additionalProperties: false
      required:
        - id
        - grantee_party_id
        - commands
        - scope
        - valid_from
        - valid_until
        - basis
        - granted_by_user_id
        - granted_role
        - operation_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        grantee_party_id:
          type: string
          format: uuid
        commands:
          type: array
          items:
            type: string
        scope:
          $ref: '#/components/schemas/GrantScope'
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        basis:
          type: string
        granted_by_user_id:
          type: string
          format: uuid
        granted_role:
          type: string
          enum: [admin]
        operation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    TextList:
      type: array
      minItems: 1
      maxItems: 50
      items:
        type: string
        minLength: 1
        maxLength: 500
    BrandPartnerRequest:
      type: object
      additionalProperties: false
      required: [brand_name]
      properties:
        brand_name:
          type: string
          minLength: 1
          maxLength: 200
        exposure_authorization_ref:
          type: string
          minLength: 1
          maxLength: 255
          description: Referência da autorização de exposição pública da marca (BR-015), se já existir.
    BrandExposureRequest:
      type: object
      additionalProperties: false
      required: [exposure_authorization_ref]
      properties:
        exposure_authorization_ref:
          type: string
          minLength: 1
          maxLength: 255
    BrandPartnerTerminationRequest:
      type: object
      additionalProperties: false
      required: [terminated_effective_at, termination_basis]
      properties:
        terminated_effective_at:
          type: string
          format: date-time
          description: Instante de eficácia do encerramento (passado ou futuro), com deslocamento.
        termination_basis:
          type: string
          minLength: 1
          maxLength: 255
          description: Referência do instrumento ou da base do encerramento.
    BrandPartner:
      type: object
      additionalProperties: false
      required:
        - id
        - brand_name
        - exposure_authorization_ref
        - exposure_authorized_at
        - terminated_effective_at
        - termination_basis
        - termination_registered_at
        - operation_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        brand_name:
          type: string
        exposure_authorization_ref:
          type: [string, 'null']
        exposure_authorized_at:
          type: [string, 'null']
          format: date-time
        terminated_effective_at:
          type: [string, 'null']
          format: date-time
        termination_basis:
          type: [string, 'null']
        termination_registered_at:
          type: [string, 'null']
          format: date-time
        operation_id:
          type: string
          format: uuid
          description: Operação que registrou a Brand Partner.
        created_at:
          type: string
          format: date-time
    HomeConceptVersionRequest:
      description: |
        Home Concept novo (com `brand_partner_id` e `title`) ou versão nova (com `home_concept_id`). Resumo e
        classificações (lifestyle 1–3, estilo 1–2, de vocabulário controlado ativo) são opcionais e gravados com a versão,
        imutáveis como a especificação (BR-013); termo inexistente → 404, desativado → 409 (spec catalog §13.12). A versão
        não tem atributos físicos: tipologia, área, suítes e capacidade pertencem à Home Edition (`03` §3.1).
      oneOf:
        - type: object
          additionalProperties: false
          required: [brand_partner_id, title, essential_elements, preservation_premises, specification]
          properties:
            brand_partner_id:
              type: string
              format: uuid
            title:
              type: string
              minLength: 1
              maxLength: 200
            essential_elements:
              $ref: '#/components/schemas/TextList'
            preservation_premises:
              $ref: '#/components/schemas/TextList'
            specification:
              type: string
              minLength: 1
              maxLength: 20000
            summary:
              $ref: '#/components/schemas/HomeConceptSummary'
            lifestyle_ids:
              $ref: '#/components/schemas/LifestyleIds'
            architectural_style_ids:
              $ref: '#/components/schemas/ArchitecturalStyleIds'
        - type: object
          additionalProperties: false
          required: [home_concept_id, essential_elements, preservation_premises, specification]
          properties:
            home_concept_id:
              type: string
              format: uuid
            essential_elements:
              $ref: '#/components/schemas/TextList'
            preservation_premises:
              $ref: '#/components/schemas/TextList'
            specification:
              type: string
              minLength: 1
              maxLength: 20000
            summary:
              $ref: '#/components/schemas/HomeConceptSummary'
            lifestyle_ids:
              $ref: '#/components/schemas/LifestyleIds'
            architectural_style_ids:
              $ref: '#/components/schemas/ArchitecturalStyleIds'
    HomeConceptVersionApprovalRequest:
      type: object
      additionalProperties: false
      required: [approval_refs]
      properties:
        approval_refs:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: Referências das aprovações registradas (plano estratégico da BR-010, governança da BR-018).
          items:
            type: string
            minLength: 1
            maxLength: 255
    HomeConceptVersion:
      type: object
      additionalProperties: false
      required:
        - id
        - home_concept_id
        - brand_partner_id
        - title
        - version
        - state
        - essential_elements
        - preservation_premises
        - specification
        - summary
        - lifestyle_ids
        - architectural_style_ids
        - approval_refs
        - approved_at
        - approved_by_user_id
        - approved_role
        - operation_id
        - created_at
      properties:
