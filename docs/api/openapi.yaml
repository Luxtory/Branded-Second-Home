        - valid_from
        - valid_until
        - revoked_at
        - revocation_basis
        - registered_by_user_id
        - registered_role
        - operation_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        home_concept_id:
          type: string
          format: uuid
        instrument_ref:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        revocation_basis:
          type: [string, 'null']
        registered_by_user_id:
          type: string
          format: uuid
        registered_role:
          type: string
          enum: [admin]
        operation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    HomeEditionList:
      type: array
      minItems: 1
      maxItems: 50
      items:
        type: string
        minLength: 1
        maxLength: 200
      description: Lista opcional de 1 a 50 itens de até 200 caracteres.
    HomeEditionRequest:
      type: object
      additionalProperties: false
      description: |
        Home Edition em preparação (BR-031). A definição material (tipologia, configuração dos espaços, área projetada,
        suítes, capacidade, ambientes, amenidades, características) pode ser corrigida até a finalização e é imutável
        depois dela (BR-036); o Home Concept nunca muda. Sem localização, modalidade, estrutura patrimonial nem condições
        comerciais.
      required:
        [home_concept_id, name, description, typology, spatial_configuration, projected_area_m2, suites, guests_max]
      properties:
        home_concept_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Nome público da Home Edition (editorial).
        description:
          type: string
          minLength: 1
          maxLength: 20000
          description: Descrição pública (editorial).
        typology:
          type: string
          minLength: 1
          maxLength: 200
          description: Tipologia (material).
        spatial_configuration:
          type: string
          minLength: 1
          maxLength: 4000
          description: Configuração dos espaços (material).
        projected_area_m2:
          $ref: '#/components/schemas/ProjectedAreaM2'
        suites:
          $ref: '#/components/schemas/Suites'
        guests_max:
          $ref: '#/components/schemas/GuestsMax'
        rooms:
          $ref: '#/components/schemas/HomeEditionList'
        amenities:
          $ref: '#/components/schemas/HomeEditionList'
        characteristics:
          $ref: '#/components/schemas/HomeEditionList'
    HomeEditionDraftRequest:
      type: object
      additionalProperties: false
      description: |
        Substitui a preparação de uma Home Edition em `draft` (BR-031). A definição material (tipologia, configuração dos espaços, área projetada,
        suítes, capacidade, ambientes, amenidades, características) pode ser corrigida até a finalização e é imutável
        depois dela (BR-036); o Home Concept nunca muda. Sem localização, modalidade, estrutura patrimonial nem condições
        comerciais.
      required:
        [name, description, typology, spatial_configuration, projected_area_m2, suites, guests_max]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Nome público da Home Edition (editorial).
        description:
          type: string
          minLength: 1
          maxLength: 20000
          description: Descrição pública (editorial).
        typology:
          type: string
          minLength: 1
          maxLength: 200
          description: Tipologia (material).
        spatial_configuration:
          type: string
          minLength: 1
          maxLength: 4000
          description: Configuração dos espaços (material).
        projected_area_m2:
          $ref: '#/components/schemas/ProjectedAreaM2'
        suites:
          $ref: '#/components/schemas/Suites'
        guests_max:
          $ref: '#/components/schemas/GuestsMax'
        rooms:
          $ref: '#/components/schemas/HomeEditionList'
        amenities:
          $ref: '#/components/schemas/HomeEditionList'
        characteristics:
          $ref: '#/components/schemas/HomeEditionList'
    HomeEdition:
      type: object
      additionalProperties: false
      required:
        - id
        - home_concept_id
        - name
        - description
        - typology
        - spatial_configuration
        - projected_area_m2
        - suites
        - guests_max
        - rooms
        - amenities
        - characteristics
        - material_state
        - finalized_at
        - finalized_by_user_id
        - finalized_role
        - visibility
        - withdrawal_basis
        - operation_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        home_concept_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        typology:
          type: string
        spatial_configuration:
          type: string
        projected_area_m2:
          type: integer
        suites:
          type: integer
        guests_max:
          type: integer
        rooms:
          type: [array, 'null']
          items:
            type: string
        amenities:
          type: [array, 'null']
          items:
            type: string
        characteristics:
          type: [array, 'null']
          items:
            type: string
        material_state:
          type: string
          enum: [draft, finalized]
          description: |
            `draft` = preparação (definição material editável); `finalized` = definição material imutável, base possível
            de Second Home (BR-036). Não volta a `draft`.
        finalized_at:
          type: [string, 'null']
          format: date-time
        finalized_by_user_id:
          type: [string, 'null']
          format: uuid
        finalized_role:
          type: [string, 'null']
          enum: [admin, null]
        visibility:
          type: string
          enum: [hidden, public]
          description: Visibilidade pública, separada do estado material; `public` exige `finalized`.
        withdrawal_basis:
          type: [string, 'null']
          description: Base da última retirada do público; nula enquanto pública ou se nunca foi retirada.
        operation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    HomeEditionWithdrawalRequest:
      type: object
      additionalProperties: false
      required: [withdrawal_basis]
      properties:
        withdrawal_basis:
          type: string
          minLength: 1
          maxLength: 255
    HomeEditionEditorialCorrectionRequest:
      type: object
      additionalProperties: false
      description: Pelo menos `name` ou `description`, diferente do atual; a base é obrigatória (BR-036).
      required: [correction_basis]
      minProperties: 2
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 20000
        correction_basis:
          type: string
          minLength: 1
          maxLength: 255
    SecondHomeRequest:
      type: object
      additionalProperties: false
      required: [home_edition_id, label, timezone]
      properties:
        home_edition_id:
          type: string
          format: uuid
          description: Home Edition materialmente finalizada da qual a Second Home deriva (BR-003, BR-035).
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: Referência interna da Second Home; sem nome de pessoa nem endereço.
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: Fuso IANA da Second Home (TECH-040), sem valor padrão.
        investor_authorization_id:
          type: string
          format: uuid
          description: Autorização do Investor (REQ-027), quando a Second Home é desenvolvida por Investor.
    SecondHome:
      type: object
      additionalProperties: false
      required:
        - id
        - home_edition_id
        - home_concept_id
        - home_concept_version_id
        - home_concept_version
        - commercially_approved_at
        - label
        - timezone
        - investor_authorization_id
        - operation_id
      properties:
        id:
          type: string
          format: uuid
        home_edition_id:
          type: string
          format: uuid
        home_concept_id:
          type: string
          format: uuid
        home_concept_version_id:
          type: string
          format: uuid
          description: Versão vigente do Home Concept fixada na aprovação comercial (BR-025).
        home_concept_version:
          type: integer
          minimum: 1
        commercially_approved_at:
          type: string
          format: date-time
          description: Instante da aprovação comercial, que é o registro da Second Home (ADR-0010 §2, ADR-0019).
        label:
          type: string
        timezone:
          type: string
        investor_authorization_id:
          type: [string, 'null']
          format: uuid
        operation_id:
          type: string
          format: uuid
    EmptyRequest:
      type: object
      additionalProperties: false
      description: Corpo vazio — o objeto vem do caminho.
    CatalogTermKind:
      type: string
      enum: [lifestyle, architectural_style]
      description: Vocabulário controlado da Coleção (spec catalog §13.12).
    CatalogTermLabel:
      type: string
      minLength: 1
      maxLength: 80
    CatalogTermRequest:
      type: object
      additionalProperties: false
      required: [kind, label]
