asyncapi: 3.0.0
info:
  title: Luxtory Branded Second Home Events
  version: 0.1.0
  description: |
    Eventos de domínio da plataforma Luxtory. São gravados no outbox transacional do PostgreSQL no mesmo commit do
    command que os origina e entregues ao menos uma vez a consumidores idempotentes (TECH-091 do
    `docs/specs/canonical/03-technical-spec.md`); falha de entrega nunca desfaz o domínio. Não há broker externo:
    o disparo ocorre após o commit e por varredura periódica (ADR-0004). Os canais entram a partir da W1.
    Update this file **before** producing or consuming a new event.

defaultContentType: application/json

channels:
  outbox:
    address: app.outbox
    title: Outbox transacional
    description: |
      Tabela `app.outbox` (ADR-0006). Um command grava seus eventos no mesmo commit do domínio (TECH-054);
      `dedup_key` único impede o mesmo evento duas vezes. Entrega ao menos uma vez (ADR-006): disparo após o commit
      (`after()` do Next) e varredura pelo job `outbox` (TECH-090). W8 substitui o descarte W1 de eventos sem consumidor:
      apenas tipos com consumidor registrado são selecionados, antes do LIMIT/locks. Os demais permanecem pendentes,
      sem attempts, receipt, delivered_at ou falha; não ocupam o lote nem impedem eventos processáveis.
      W9 (ADR-0022): `available_at` opcional na linha — evento com momento futuro também fica pendente sem tentativa,
      erro, recibo ou vaga no lote, filtrado no mesmo ponto. A seleção ordena por `attempts`, `occurred_at`, `id`:
      falhas recorrentes cedem a vez a eventos independentes. Falha no COMMIT da transação de um evento é registrada
      em transação própria e a varredura continua. `available_at` é agendamento de entrega, não campo do envelope.
      Os tipos de evento (`type`) e seus payloads entram aqui com a wave que os produz.
    messages:
      outboxEvent:
        $ref: '#/components/messages/OutboxEvent'
      initialDrawScheduled:
        $ref: '#/components/messages/InitialDrawScheduled'
      initialDrawCommitted:
        $ref: '#/components/messages/InitialDrawCommitted'
      initialDrawCompleted:
        $ref: '#/components/messages/InitialDrawCompleted'
      useWindowOpened:
        $ref: '#/components/messages/UseWindowOpened'
      leapDayGranted:
        $ref: '#/components/messages/LeapDayGranted'
      ownUseBookingConfirmed:
        $ref: '#/components/messages/OwnUseBookingConfirmed'
      ownUseBookingCancelled:
        $ref: '#/components/messages/OwnUseBookingCancelled'
      ownUseNoShowDeclared:
        $ref: '#/components/messages/OwnUseNoShowDeclared'
      ownUseExceptionOpened:
        $ref: '#/components/messages/OwnUseExceptionOpened'
      ownUseExceptionResolved:
        $ref: '#/components/messages/OwnUseExceptionResolved'
      ownUseBookingInvalidated:
        $ref: '#/components/messages/OwnUseBookingInvalidated'

operations:
  publishOutboxEvent:
    action: send
    channel:
      $ref: '#/channels/outbox'
    summary: Um command grava o evento na mesma transação do seu efeito.
    messages:
      - $ref: '#/channels/outbox/messages/outboxEvent'
  consumeOutboxEvent:
    action: receive
    channel:
      $ref: '#/channels/outbox'
    summary: |
      Cada consumidor registrado recebe o evento ao menos uma vez e ignora duplicatas por `outbox_receipt(event_id,
      consumer)`. Falha de um consumidor incrementa `attempts`, mantém o evento pendente e nunca desfaz o domínio
      (TECH-091). O recibo comita na mesma transação que os efeitos do consumidor no banco: só esses efeitos têm
      garantia de uma única vez. Efeito externo pode se repetir numa nova entrega; o consumidor usa idempotência no
      destino, com o `id` do evento como chave.
    messages:
      - $ref: '#/channels/outbox/messages/outboxEvent'

components:
  messages:
    InitialDrawScheduled:
      name: ownership.initial_draw_scheduled
      title: Necessidade do sorteio inicial registrada na formalização Co-Owner
      description: |
        W8 produz no mesmo commit da formalização. Nenhum consumer W8, seed ou resultado de sorteio.
        Permanece pendente até W9 registrar consumer; W9 implementa participantes, aleatoriedade e evidências.
        W9: consumido por `ownership_initial_draw_commit` (spec ownership §16.2), que grava o compromisso.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/OutboxEnvelope'
          - type: object
            properties:
              type:
                const: ownership.initial_draw_scheduled
              payload:
                $ref: '#/components/schemas/InitialDrawScheduledPayload'
    InitialDrawCommitted:
      name: ownership.initial_draw_committed
      title: Compromisso do sorteio inicial gravado (TECH-093 passos 1–3)
      description: |
        Enfileirado pelo consumidor de commit na mesma transação do compromisso, com `available_at` = instante da
        rodada alvo + um período do beacon. Consumido por `ownership_initial_draw_commit_evidence` (evidência do COMMIT
        pelo servidor, T-910/ADR-0023) e, em seguida, por `ownership_initial_draw_reveal`. Nunca carrega seed.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/OutboxEnvelope'
          - type: object
            properties:
              type:
                const: ownership.initial_draw_committed
              payload:
                $ref: '#/components/schemas/InitialDrawCommittedPayload'
    InitialDrawCompleted:
      name: ownership.initial_draw_completed
      title: Resultado do sorteio inicial gravado (TECH-093 passos 4–7)
      description: |
        Enfileirado pela revelação na mesma transação do resultado. Consumido por
        `ownership_initial_draw_notification`, que registra a notificação do resultado (REQ-097, TECH-091), e por
        `calendar_use_windows_on_draw` (W11), que agenda as janelas dos exercícios já selados sob a trava da Second Home.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/OutboxEnvelope'
          - type: object
            properties:
              type:
                const: ownership.initial_draw_completed
              payload:
                $ref: '#/components/schemas/InitialDrawCompletedPayload'
    UseWindowOpened:
      name: calendar.use_window_opened
      title: Abertura da janela de reserva de uma Ação no exercício (TECH-042, REQ-097)
      description: |
        Um por Ação e exercício (`dedup_key` = `calendar.use_window_opened:<stake_id>:<exercise_year>`), gravado pelo
        passo `seal` do `open_exercise` quando o sorteio já foi revelado, ou pelo consumidor da revelação para os
        exercícios já selados. `available_at` = abertura canônica da posição (nunca antes do `occurred_at`): janela já
        aberta é entregue já. Consumido por `calendar_use_right_notification`, que registra a notificação aos titulares
        vigentes da Ação na entrega. A elegibilidade nunca depende deste evento (D4): é recalculada pelas regras.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/OutboxEnvelope'
          - type: object
            properties:
              type:
                const: calendar.use_window_opened
              payload:
                $ref: '#/components/schemas/UseWindowOpenedPayload'
    LeapDayGranted:
      name: calendar.leap_day_granted
      title: Direito ao 29 de fevereiro concedido à Ação contemplada (TECH-027, REQ-097)
      description: |
        Gravado pelo passo `leap_day` do `open_exercise` na transação da concessão (`dedup_key` =
        `calendar.leap_day_granted:<second_home_id>:<exercise_year>`), com `available_at` = base do exercício (TECH-042:
        o 29/02 abre para a Ação contemplada na base). Consumido por `calendar_use_right_notification`; depois de
        `expires_at` nada é notificado.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/OutboxEnvelope'
          - type: object
            properties:
              type:
                const: calendar.leap_day_granted
              payload:
                $ref: '#/components/schemas/LeapDayGrantedPayload'
    OwnUseBookingConfirmed:
      name: booking.own_use_confirmed
      title: Reserva de uso próprio confirmada (REQ-097, W12)
      description: |
        Gravado pelo `create_own_use_booking` na transação da reserva (`dedup_key` =
        `booking.own_use_confirmed:<booking_id>`), entrega imediata. Consumido por
        `booking_own_use_confirmation_notification`, que registra a notificação à party que reservou — fixada no evento
        no COMMIT, não aos titulares vigentes na entrega: a confirmação é um ato, e continua de quem reservou numa
        transferência futura (ADR-0026 D6). Alcança também Titular sem Membership. Só ids, datas e número de noites.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/OutboxEnvelope'
          - type: object
            properties:
              type:
                const: booking.own_use_confirmed
              payload:
                $ref: '#/components/schemas/OwnUseBookingConfirmedPayload'
    OwnUseBookingCancelled:
      name: booking.own_use_cancelled
      title: Reserva de uso próprio cancelada (REQ-080, REQ-081, PD-010)
      description: |
        Ciclo da reserva de uso próprio (W13, REQ-097, TECH-091; spec booking §10.12). Um evento por transição de estado
        que notifica, gravado na transação do command (`dedup_key` = `<tipo>:<id da transição>`: o id é PK de
        `app.booking_state_transition`, gravado na mesma transação, e cada operação grava no máximo uma transição — o
        `ON CONFLICT (dedup_key) DO NOTHING` nunca descarta outro evento). Destinatário: a party da `holding_id` da
        reserva, fixada no COMMIT (como na confirmação, ADR-0026 D6). Só ids, datas, contagens e enums: nunca a base
        registrada, a referência do incidente ou dado pessoal.
        Produtores: `cancel_own_use_booking` (`cause = titular`; durante exceção, com o `exception_id` que o cancelamento
        encerra — sem evento de resolução separado) e `resolve_exception → cancelled` na exceção operacional
        (`cause = exception`).
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/OutboxEnvelope'
          - type: object
            properties:
              type:
                const: booking.own_use_cancelled
              payload:
                $ref: '#/components/schemas/OwnUseBookingCancelledPayload'
    OwnUseNoShowDeclared:
      name: booking.own_use_no_show_declared
      title: No-show declarado (BR-282, TECH-046)
      description: |
        Ciclo da reserva de uso próprio (W13, REQ-097, TECH-091; spec booking §10.12). Um evento por transição de estado
        que notifica, gravado na transação do command (`dedup_key` = `<tipo>:<id da transição>`: o id é PK de
        `app.booking_state_transition`, gravado na mesma transação, e cada operação grava no máximo uma transição — o
        `ON CONFLICT (dedup_key) DO NOTHING` nunca descarta outro evento). Destinatário: a party da `holding_id` da
        reserva, fixada no COMMIT (como na confirmação, ADR-0026 D6). Só ids, datas, contagens e enums: nunca a base
        registrada, a referência do incidente ou dado pessoal.
        Produtor: `declare_no_show`. Reserva de uma noite ou ausência constatada na última noite: zero noites liberadas.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/OutboxEnvelope'
          - type: object
            properties:
              type:
                const: booking.own_use_no_show_declared
              payload:
                $ref: '#/components/schemas/OwnUseNoShowDeclaredPayload'
    OwnUseExceptionOpened:
      name: booking.own_use_exception_opened
      title: Reserva posta em exceção (PD-010, REQ-083, REQ-084)
      description: |
        Ciclo da reserva de uso próprio (W13, REQ-097, TECH-091; spec booking §10.12). Um evento por transição de estado
        que notifica, gravado na transação do command (`dedup_key` = `<tipo>:<id da transição>`: o id é PK de
        `app.booking_state_transition`, gravado na mesma transação, e cada operação grava no máximo uma transição — o
        `ON CONFLICT (dedup_key) DO NOTHING` nunca descarta outro evento). Destinatário: a party da `holding_id` da
        reserva, fixada no COMMIT (como na confirmação, ADR-0026 D6). Só ids, datas, contagens e enums: nunca a base
        registrada, a referência do incidente ou dado pessoal.
        Produtor: `open_exception` (exceção operacional ou apuração de reserva não autorizada). `timely_until` só no
        Co-Owner em exceção operacional: o instante até o qual o cancelamento é tempestivo (1º check-in − 360 h).
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/OutboxEnvelope'
          - type: object
            properties:
              type:
                const: booking.own_use_exception_opened
              payload:
                $ref: '#/components/schemas/OwnUseExceptionOpenedPayload'
    OwnUseExceptionResolved:
      name: booking.own_use_exception_resolved
      title: Exceção resolvida sem cancelamento (PD-010, REQ-084)
      description: |
        Ciclo da reserva de uso próprio (W13, REQ-097, TECH-091; spec booking §10.12). Um evento por transição de estado
        que notifica, gravado na transação do command (`dedup_key` = `<tipo>:<id da transição>`: o id é PK de
        `app.booking_state_transition`, gravado na mesma transação, e cada operação grava no máximo uma transição — o
        `ON CONFLICT (dedup_key) DO NOTHING` nunca descarta outro evento). Destinatário: a party da `holding_id` da
        reserva, fixada no COMMIT (como na confirmação, ADR-0026 D6). Só ids, datas, contagens e enums: nunca a base
        registrada, a referência do incidente ou dado pessoal.
        Produtor: `resolve_exception → confirmed | completed`. A resolução que cancela emite
        `booking.own_use_cancelled` (exceção operacional) ou `booking.own_use_invalidated` (apuração).
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/OutboxEnvelope'
          - type: object
            properties:
              type:
                const: booking.own_use_exception_resolved
              payload:
                $ref: '#/components/schemas/OwnUseExceptionResolvedPayload'
    OwnUseBookingInvalidated:
      name: booking.own_use_invalidated
      title: Reserva não autorizada invalidada (REQ-084, TECH-022, TECH-026)
      description: |
        Ciclo da reserva de uso próprio (W13, REQ-097, TECH-091; spec booking §10.12). Um evento por transição de estado
        que notifica, gravado na transação do command (`dedup_key` = `<tipo>:<id da transição>`: o id é PK de
        `app.booking_state_transition`, gravado na mesma transação, e cada operação grava no máximo uma transição — o
        `ON CONFLICT (dedup_key) DO NOTHING` nunca descarta outro evento). Destinatário: a party da `holding_id` da
        reserva, fixada no COMMIT (como na confirmação, ADR-0026 D6). Só ids, datas, contagens e enums: nunca a base
        registrada, a referência do incidente ou dado pessoal.
        Produtores: `correct_use_right` (Co-Owner; `corrected` = consumo revertido por categoria) e
        `resolve_exception → cancelled` na apuração de reserva de Owner (`corrected = null`).
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/OutboxEnvelope'
          - type: object
            properties:
              type:
                const: booking.own_use_invalidated
              payload:
                $ref: '#/components/schemas/OwnUseBookingInvalidatedPayload'
    OutboxEvent:
      name: OutboxEvent
      title: Envelope de evento do outbox
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OutboxEnvelope'
  schemas:
    InitialDrawScheduledPayload:
      type: object
      additionalProperties: false
      required: [acquisition_id, second_home_id]
      properties:
        acquisition_id:
          type: string
          format: uuid
        second_home_id:
          type: string
          format: uuid
    InitialDrawCommittedPayload:
      type: object
      additionalProperties: false
      required: [draw_id, acquisition_id, second_home_id, target_round]
      properties:
        draw_id:
          type: string
          format: uuid
        acquisition_id:
          type: string
          format: uuid
        second_home_id:
          type: string
          format: uuid
        target_round:
          type: integer
          minimum: 1
          description: Rodada da rede drand quicknet fixada no compromisso.
    InitialDrawCompletedPayload:
      type: object
      additionalProperties: false
      required: [draw_id, acquisition_id, second_home_id]
      properties:
        draw_id:
          type: string
          format: uuid
        acquisition_id:
          type: string
          format: uuid
        second_home_id:
          type: string
          format: uuid
    UseWindowOpenedPayload:
      type: object
      additionalProperties: false
      required: [second_home_id, stake_id, exercise_year, position, opens_at]
      properties:
        second_home_id:
          type: string
          format: uuid
        stake_id:
          type: string
          format: uuid
        exercise_year:
          type: integer
          minimum: 1
          maximum: 9999
        position:
          type: integer
          minimum: 1
          maximum: 10
          description: Posição ordinária da Ação no exercício (BR-101).
        opens_at:
          type: string
          format: date-time
          description: Abertura canônica da posição (TECH-042), em UTC.
    LeapDayGrantedPayload:
      type: object
      additionalProperties: false
      required: [second_home_id, stake_id, exercise_year, expires_at]
      properties:
        second_home_id:
          type: string
          format: uuid
        stake_id:
          type: string
          format: uuid
        exercise_year:
          type: integer
          minimum: 1
          maximum: 9999
        expires_at:
          type: string
          format: date-time
          description: Fim efetivo do 29/02 (00:00 de 01/03 no fuso da Second Home), em UTC.
    OwnUseBookingConfirmedPayload:
      type: object
      additionalProperties: false
      required: [booking_id, second_home_id, recipient_party_id, checkin_date, checkout_date, nights]
      properties:
        booking_id:
          type: string
          format: uuid
        second_home_id:
          type: string
          format: uuid
        recipient_party_id:
          type: string
          format: uuid
          description: Pessoa ou empresa que reservou (pseudônimo interno, nunca documento).
        checkin_date:
          type: string
          format: date
        checkout_date:
          type: string
          format: date
          description: Data de saída; não consome Direito de Uso (PD-002).
        nights:
          type: integer
          minimum: 1
    OwnUseLifecycleNights:
      type: object
      additionalProperties: false
      description: Noites por categoria do Direito de Uso (TECH-027), uma por data.
      required: [alta, media, leap]
      properties:
        alta:
          type: integer
          minimum: 0
        media:
          type: integer
          minimum: 0
        leap:
          type: integer
          minimum: 0
    OwnUseBookingCancelledPayload:
      type: object
      additionalProperties: false
      required: [booking_id, second_home_id, recipient_party_id, cause, exception_id, exception_type,
        cancellation_class, released_nights, first_released_date, restored, forfeited_nights]
      properties:
        booking_id:
          type: string
          format: uuid
        second_home_id:
          type: string
          format: uuid
        recipient_party_id:
          type: string
          format: uuid
          description: Pessoa ou empresa da holding da reserva (pseudônimo interno, nunca documento).
        cause:
          type: string
          enum: [titular, exception]
        exception_id:
          type: [string, 'null']
          format: uuid
        exception_type:
          type: [string, 'null']
          enum: [operational, unauthorized_booking, null]
        cancellation_class:
          type: [string, 'null']
          enum: [timely, late, null]
          description: Classificação gravada (REQ-080); nula no Owner, que não tem classe (REQ-081).
        released_nights:
          type: integer
          minimum: 1
        first_released_date:
          type: string
          format: date
        restored:
          oneOf:
            - $ref: '#/components/schemas/OwnUseLifecycleNights'
            - type: 'null'
          description: Direito de Uso devolvido (Co-Owner tempestivo); nulo nos demais casos.
        forfeited_nights:
          type: [integer, 'null']
          minimum: 0
          description: Noites futuras que viram `forfeited_right` (Co-Owner tardio); nulo nos demais casos.
    OwnUseNoShowDeclaredPayload:
      type: object
      additionalProperties: false
      required: [booking_id, second_home_id, recipient_party_id, released_nights, first_released_date,
        forfeited_nights]
      properties:
        booking_id:
          type: string
          format: uuid
        second_home_id:
          type: string
          format: uuid
        recipient_party_id:
          type: string
          format: uuid
        released_nights:
          type: integer
          minimum: 0
        first_released_date:
          type: [string, 'null']
          format: date
        forfeited_nights:
          type: [integer, 'null']
          minimum: 0
          description: Noites futuras que viram `forfeited_right` (Co-Owner); nulo no Owner.
    OwnUseExceptionOpenedPayload:
      type: object
      additionalProperties: false
      required: [booking_id, second_home_id, recipient_party_id, exception_id, exception_type, reason, timely_until]
      properties:
        booking_id:
          type: string
          format: uuid
        second_home_id:
          type: string
          format: uuid
        recipient_party_id:
          type: string
          format: uuid
        exception_id:
          type: string
          format: uuid
        exception_type:
          type: string
          enum: [operational, unauthorized_booking]
        reason:
          type: [string, 'null']
          enum: [emergency_maintenance, security, casualty, fortuitous_event, force_majeure, null]
          description: Motivo da lista fechada da PD-010 (exceção operacional); nulo na apuração.
        timely_until:
          type: [string, 'null']
          format: date-time
          description: 1º check-in − 360 h (TECH-043), com microssegundos; só no Co-Owner em exceção operacional.
    OwnUseExceptionResolvedPayload:
      type: object
      additionalProperties: false
      required: [booking_id, second_home_id, recipient_party_id, exception_id, exception_type, outcome]
      properties:
        booking_id:
          type: string
          format: uuid
        second_home_id:
          type: string
          format: uuid
        recipient_party_id:
          type: string
          format: uuid
        exception_id:
          type: string
          format: uuid
        exception_type:
          type: string
          enum: [operational, unauthorized_booking]
        outcome:
          type: string
          enum: [confirmed, completed]
    OwnUseBookingInvalidatedPayload:
      type: object
      additionalProperties: false
      required: [booking_id, second_home_id, recipient_party_id, exception_id, released_nights, first_released_date,
        corrected]
      properties:
        booking_id:
          type: string
          format: uuid
        second_home_id:
          type: string
          format: uuid
        recipient_party_id:
          type: string
          format: uuid
        exception_id:
          type: string
          format: uuid
        released_nights:
          type: integer
          minimum: 1
        first_released_date:
          type: string
          format: date
        corrected:
          oneOf:
            - $ref: '#/components/schemas/OwnUseLifecycleNights'
            - type: 'null'
          description: Consumo revertido por `correction` (Co-Owner, TECH-026); nulo no Owner.
    OutboxEnvelope:
      type: object
      additionalProperties: false
      required: [id, type, dedup_key, operation_id, occurred_at, payload]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: Tipo do evento, `módulo.evento` em minúsculas.
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'
        dedup_key:
          type: string
          description: Chave de deduplicação escolhida pelo produtor; única em todo o outbox.
          minLength: 1
          maxLength: 255
        operation_id:
          type: string
          format: uuid
          description: Operação (TECH-002) que produziu o evento.
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          description: Dados do evento, sem dado pessoal bruto nem segredo (TECH-100).
