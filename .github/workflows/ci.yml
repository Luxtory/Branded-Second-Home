# Luxtory CI/CD (ADR-0004). Os comandos são os de CLAUDE.md > ## Commands.
# Actions fixadas por SHA completo (comentário = versão), atualizadas pelo Dependabot.
# PR e push em main: lint, typecheck, test (Vitest + PostgreSQL real + Design System + migrations), e2e, security.
# Push em main, com todos verdes: migrate (dbmate) → deploy de produção (Vercel CLI). O deploy Git de main está
# desligado em vercel.json: produção só sai por este workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

# PRs: uma execução nova cancela a anterior. main: nunca cancela (migrate/deploy não podem parar no meio).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - name: Install
        run: npm ci
      - name: Test
        run: npm run test:ds          # Design System (node --test)
      - name: Coverage threshold
        run: npm run coverage         # Vitest unit + db (PostgreSQL real); falha abaixo de 80% em domain/ e application/
      - name: Migrations up → down → up
        run: npm run db:check
      - name: Traceability
        run: npm run trace            # lista os IDs cobertos por testes aprovados

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - name: Install
        run: npm ci
      - name: Playwright WebKit (smoke do shell e do login, ADR-0009)
        run: npx playwright install --with-deps webkit
      - name: E2E (next build + Playwright/axe com o Chrome do runner + smoke WebKit)
        run: npm run test:e2e
        env:
          PLAYWRIGHT_WEBKIT: '1'
      - name: W8 acquisition writes closed (PostgreSQL real)
        run: npx playwright test tests/e2e/acquisition-admin.spec.ts --grep 'gate W8 fechado'
        env:
          E2E_ACQUISITION_GATE: 'closed'
      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read   # gitleaks-action lista os commits do PR pela API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 } # gitleaks needs full history
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: SAST (Semgrep CE)
        run: pipx run --spec semgrep==1.178.0 semgrep scan --config p/default --error --metrics=off

  migrate:
    name: migrate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, e2e, security]
    runs-on: ubuntu-latest
    concurrency: { group: production, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - name: Install
        run: npm ci
      - name: Apply migrations (dbmate --strict)
        run: npm run db:migrate
        env:
          DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}

  deploy:
    name: deploy
    needs: [migrate]
    runs-on: ubuntu-latest
    concurrency: { group: production, cancel-in-progress: false }
    env:
      # Identificadores do projeto na Vercel (não são segredo); o token vem de secrets.
      VERCEL_ORG_ID: team_qTseTMCEpdMeoQFB6WnaATef
      VERCEL_PROJECT_ID: prj_GJINhlmRANMTVzK6tBzFfOuTldJ0
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - name: Require VERCEL_TOKEN
        run: test -n "$VERCEL_TOKEN" || { echo "::error::secret VERCEL_TOKEN is not set"; exit 1; }
      - name: Pull production settings
        run: npx --yes vercel@60.0.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: npx --yes vercel@60.0.1 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy to production
        run: npx --yes vercel@60.0.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
